{% extends "layout.html" %}
{% block title %}编辑学生{% endblock %}

{% block content %}
<h1>✏️ 编辑学生</h1>
<p class="text-muted">正在编辑：<strong>{{ student.name }}</strong>（ID: {{ student.id }}）</p>

<form method="post" action="{{ url_for('edit_student', student_id=student.id) }}">
    <div class="mb-3">
        <label for="name" class="form-label">姓名 <span class="text-danger">*</span></label>
        <input type="text" id="name" name="name" class="form-control"
               value="{{ student.name }}" placeholder="请输入姓名" required>
    </div>
    <div class="mb-3">
        <label for="age" class="form-label">年龄 <span class="text-danger">*</span></label>
        <input type="number" id="age" name="age" class="form-control"
               value="{{ student.age }}" placeholder="请输入年龄 (1-150)"
               min="1" max="150" required>
    </div>
    <div class="mb-3">
        <label for="grade" class="form-label">班级</label>
        <input type="text" id="grade" name="grade" class="form-control"
               value="{{ student.grade }}" placeholder="如: 2024级1班">
    </div>
    <div class="mb-3">
        <label for="major" class="form-label">专业</label>
        <input type="text" id="major" name="major" class="form-control"
               value="{{ student.major }}" placeholder="如: 计算机科学">
    </div>
    <button type="submit" class="btn btn-success">💾 保存修改</button>
    <a href="{{ url_for('student_list') }}" class="btn btn-outline-secondary">← 取消返回</a>
</form>
{% endblock %}
