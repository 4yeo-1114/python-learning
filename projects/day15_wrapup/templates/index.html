{% extends "layout.html" %}
{% block title %}首页{% endblock %}

{% block content %}
{% if session.get("user_id") %}
<h1>👋 欢迎回来, {{ session.get("username") }}!</h1>
<p>你的角色: <strong>{{ session.get("role") }}</strong></p>
<div class="d-grid gap-2 d-md-block">
    <a href="{{ url_for('student_list') }}" class="btn btn-primary">📋 查看学生列表</a>
    <a href="{{ url_for('add_student') }}" class="btn btn-success">➕ 添加学生</a>
    <a href="{{ url_for('logout') }}" class="btn btn-outline-secondary">🚪 退出登录</a>
</div>
{% else %}
<div class="text-center mt-5">
    <h1>🏫 学生管理系统</h1>
    <p class="text-muted">欢迎使用学生管理系统！请先登录或注册。</p>
    <div class="d-grid gap-2 d-md-block">
        <a href="{{ url_for('login') }}" class="btn btn-primary btn-lg">🔐 登录</a>
        <a href="{{ url_for('register') }}" class="btn btn-outline-primary btn-lg">📝 注册</a>
    </div>
</div>
{% endif %}
{% endblock %}
