{% extends "layout.html" %}

{% block title %}表单练习 — Flask 学习{% endblock %}

{% block content %}
    <h1>📝 表单练习：GET 与 POST</h1>
    <p>填写下面的表单，提交后看看会发生什么！</p>

    <form method="POST" style="background: #f9f9f9; padding: 1.5rem; border-radius: 8px; margin: 1.5rem 0;">
        <div style="margin-bottom: 1rem;">
            <label for="name" style="display: block; font-weight: bold; margin-bottom: 0.3rem;">你的名字：</label>
            <input type="text" id="name" name="name" placeholder="请输入你的名字"
                   style="width: 100%; padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px;"
                   required>
        </div>

        <div style="margin-bottom: 1rem;">
            <label for="message" style="display: block; font-weight: bold; margin-bottom: 0.3rem;">留言内容：</label>
            <textarea id="message" name="message" placeholder="你想说些什么？" rows="4"
                      style="width: 100%; padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px;"
                      required></textarea>
        </div>

        <div style="margin-bottom: 1rem;">
            <label for="color" style="display: block; font-weight: bold; margin-bottom: 0.3rem;">喜欢的颜色：</label>
            <select id="color" name="color"
                    style="width: 100%; padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px;">
                <option value="蓝色">🔵 蓝色</option>
                <option value="红色">🔴 红色</option>
                <option value="绿色">🟢 绿色</option>
                <option value="紫色">🟣 紫色</option>
            </select>
        </div>

        <button type="submit"
                style="background: #3498db; color: white; border: none; padding: 0.6rem 2rem;
                       border-radius: 4px; font-size: 1rem; cursor: pointer;">
            🚀 提交
        </button>
    </form>

    <p style="color: #888; font-size: 0.9rem;">
        提示：这个表单使用 <code>method="POST"</code>，数据不会出现在 URL 中。
        提交后，数据将通过 <code>request.form</code> 获取并显示在结果页。
    </p>
{% endblock %}
