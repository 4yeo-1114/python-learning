{% extends "layout.html" %}
{% block title %}注册{% endblock %}

{% block content %}
<h1>📝 用户注册</h1>

{% if error %}
<div class="flash-error">{{ error }}</div>
{% endif %}

<form method="POST">
    <div class="form-group">
        <label for="username">用户名</label>
        <input type="text" id="username" name="username" placeholder="请输入用户名" required>
    </div>
    <div class="form-group">
        <label for="password">密码</label>
        <input type="password" id="password" name="password" placeholder="密码至少6位" required>
    </div>
    <div class="form-group">
        <label for="confirm_password">确认密码</label>
        <input type="password" id="confirm_password" name="confirm_password" placeholder="再次输入密码" required>
    </div>
    <button type="submit" class="btn">注册</button>
</form>

<p style="margin-top: 16px;">已有账号？<a href="{{ url_for('login') }}">去登录</a></p>
{% endblock %}
