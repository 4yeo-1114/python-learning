<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}学生管理系统{% endblock %}</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Microsoft YaHei", sans-serif;
            margin: 0;
            padding: 0;
            background: #f5f5f5;
        }
        nav {
            background: #2c3e50;
            color: white;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        nav a { color: white; text-decoration: none; margin: 0 8px; }
        nav a:hover { text-decoration: underline; }
        .container {
            max-width: 800px;
            margin: 24px auto;
            padding: 24px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .flash-error { color: #e74c3c; background: #fdecea; padding: 10px; border-radius: 4px; margin-bottom: 16px; }
        .flash-success { color: #27ae60; background: #eafaf1; padding: 10px; border-radius: 4px; margin-bottom: 16px; }
        table { width: 100%; border-collapse: collapse; margin: 16px 0; }
        th, td { border: 1px solid #ddd; padding: 8px 12px; text-align: left; }
        th { background: #f0f0f0; }
        tr:hover { background: #fafafa; }
        .btn {
            display: inline-block; padding: 8px 16px;
            background: #3498db; color: white; text-decoration: none;
            border-radius: 4px; border: none; cursor: pointer; font-size: 14px;
        }
        .btn:hover { background: #2980b9; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 4px; font-weight: bold; }
        .form-group input { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        .empty-msg { text-align: center; color: #999; padding: 24px; }
        footer { text-align: center; color: #999; margin-top: 24px; padding: 12px; font-size: 13px; }
    </style>
</head>
<body>
    <nav>
        <div>
            <a href="{{ url_for('index') }}">🏠 首页</a>
            {% if session.get("user_id") %}
            <a href="{{ url_for('student_list') }}">📋 学生列表</a>
            {% endif %}
        </div>
        <div>
            {% if session.get("user_id") %}
            <span>👤 {{ session.get("username") }} ({{ session.get("role") }})</span>
            <a href="{{ url_for('logout') }}">退出</a>
            {% else %}
            <a href="{{ url_for('login') }}">登录</a>
            <a href="{{ url_for('register') }}">注册</a>
            {% endif %}
        </div>
    </nav>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    <footer>
        Day 13 Flask + 数据库整合 | Python 学习项目
    </footer>
</body>
</html>
