{% extends "layout.html" %}
{% block title %}编辑学生{% endblock %}

{% block content %}
<h1>✏️ 编辑学生</h1>
<p>正在编辑：<strong>{{ student.name }}</strong>（ID: {{ student.id }}）</p>

<form method="post" action="{{ url_for('edit_student', student_id=student.id) }}">
    <div class="form-group">
        <label for="name">姓名 <span style="color: red;">*</span></label>
        <input type="text" id="name" name="name"
               value="{{ student.name }}" placeholder="请输入姓名" required>
    </div>
    <div class="form-group">
        <label for="age">年龄 <span style="color: red;">*</span></label>
        <input type="number" id="age" name="age"
               value="{{ student.age }}" placeholder="请输入年龄 (1-150)"
               min="1" max="150" required>
    </div>
    <div class="form-group">
        <label for="grade">班级</label>
        <input type="text" id="grade" name="grade"
               value="{{ student.grade }}" placeholder="如: 2024级1班">
    </div>
    <div class="form-group">
        <label for="major">专业</label>
        <input type="text" id="major" name="major"
               value="{{ student.major }}" placeholder="如: 计算机科学">
    </div>
    <div style="display: flex; gap: 8px;">
        <button type="submit" class="btn btn-success">💾 保存修改</button>
        <a href="{{ url_for('student_list') }}" class="btn">← 取消返回</a>
    </div>
</form>
{% endblock %}
